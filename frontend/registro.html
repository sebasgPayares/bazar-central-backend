<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bazar Central — Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header" id="header-root"></header>

  <main class="auth-main">
    <section class="panel-card auth-card">
      <h1 class="auth-card__title">Crear cuenta</h1>
      <p class="page-subtitle">Regístrate como cliente para poder comprar en Bazar Central.</p>

      <form id="form-registro">
        <div class="field-row">
          <div class="field">
            <label for="tipoDocumento">Tipo de documento</label>
            <select id="tipoDocumento" required></select>
          </div>
          <div class="field">
            <label for="numeroDocumento">Número de documento</label>
            <input type="text" id="numeroDocumento" required />
          </div>
        </div>

        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required />
        </div>

        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>

        <div class="field">
          <label for="nombreUsuario">Nombre de usuario</label>
          <input type="text" id="nombreUsuario" required minlength="4" maxlength="30" autocomplete="username" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="field">
            <label for="password2">Confirmar contraseña</label>
            <input type="password" id="password2" required minlength="6" autocomplete="new-password" />
          </div>
        </div>

        <p class="form-error" id="form-error"></p>

        <button type="submit" class="btn btn-primary btn-full">Crear mi cuenta</button>
      </form>

      <p class="auth-card__switch">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </p>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="registro.js"></script>
</body>
</html>
