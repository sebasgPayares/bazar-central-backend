<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bazar Central — Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#C8321F">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header" id="header-root"></header>

  <main>
    <h1 class="page-title">Panel del negocio</h1>
    <p class="page-subtitle">
      Agrega productos, edítalos y controla el stock. Los cambios se reflejan
      al instante en el catálogo público.
    </p>

    <div class="admin-layout">
      <section class="panel-card">
        <h2 id="form-titulo">Agregar producto</h2>
        <form id="form-producto">
          <input type="hidden" id="producto-id" />

          <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required />
          </div>

          <div class="field">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="2"></textarea>
          </div>

          <div class="field">
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" placeholder="Comida, Bebidas, Ropa..." required />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="precio">Precio (COP)</label>
              <input type="number" id="precio" min="0" step="100" required />
            </div>
            <div class="field">
              <label for="stock">Stock inicial</label>
              <input type="number" id="stock" min="0" step="1" required />
            </div>
          </div>

          <div class="field">
            <label for="imagenUrl">URL de imagen (opcional)</label>
            <input type="text" id="imagenUrl" placeholder="https://..." />
          </div>

          <p class="form-error" id="form-error"></p>

          <button type="submit" class="btn btn-primary">Guardar producto</button>
          <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display:none;">Cancelar edición</button>
        </form>
      </section>

      <section>
        <table class="admin-table">
          <thead>
            <tr>
              <th></th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="panel.js"></script>
  <script src="efectos.js"></script>
</body>
</html>
