<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bazar Central — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#C8321F">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header" id="header-root"></header>

  <main class="auth-main">
    <section class="panel-card auth-card">
      <h1 class="auth-card__title">Iniciar sesión</h1>
      <p class="page-subtitle">Entra con tu usuario y contraseña de Bazar Central.</p>

      <form id="form-login">
        <div class="field">
          <label for="nombreUsuario">Usuario</label>
          <input type="text" id="nombreUsuario" required autocomplete="username" />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>

        <p class="form-error" id="form-error"></p>

        <button type="submit" class="btn btn-primary btn-full">Iniciar sesión</button>
      </form>

      <p class="auth-card__switch">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </p>
    </section>
  </main>

  <script src="api.js"></script>
  <script src="auth.js"></script>
  <script src="login.js"></script>
  <script src="efectos.js"></script>
</body>
</html>
